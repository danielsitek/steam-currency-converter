<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steam Currency Converter — Settings</title>
    <link rel="stylesheet" href="options.css" />
    <script src="options.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Steam Currency Converter</h1>
      <label for="currency">Display prices in</label>
      <select id="currency">
        <option value="CZK">CZK — Czech koruna</option>
        <option value="EUR">EUR — euro</option>
        <option value="USD">USD — US dollar</option>
        <option value="GBP">GBP — British pound</option>
        <option value="PLN">PLN — Polish zloty</option>
        <option value="CHF">CHF — Swiss franc</option>
        <option value="HUF">HUF — Hungarian forint</option>
        <option value="SEK">SEK — Swedish krona</option>
        <option value="NOK">NOK — Norwegian krone</option>
        <option value="DKK">DKK — Danish krone</option>
        <option value="CAD">CAD — Canadian dollar</option>
        <option value="AUD">AUD — Australian dollar</option>
      </select>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="note">
        Converted prices are estimates. Steam charges in the original currency, and your bank may
        use a different exchange rate.
      </p>
      <p class="credit">
        Icon adapted from
        <a
          href="https://www.figma.com/community/file/1166831539721848736"
          target="_blank"
          rel="noreferrer"
          >Solar Icons by 480 Design</a
        >
        (<a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer"
          >CC BY 4.0</a
        >).
      </p>
    </main>
  </body>
</html>
